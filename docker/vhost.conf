<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # src/, views/, sql/ and tools/ sit outside the document root and are
    # therefore unreachable over HTTP in this deployment.

    # Send the access and error logs to the container's standard streams so the
    # cloud platform collects them in its live log viewer.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
